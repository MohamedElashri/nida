
base_url = "https://melashri.net/nida/"
title = "Nida Docs"
description = "A small, fast Go static site generator for blogs, personal sites, and documentation."
language = "en"
author = "Mohamed Elashri"

content_dir = "content"
static_dir = "static"
output_dir = "public"
theme = "nida-docs"

paginate = 50
drafts = false
syntax_theme = "github"
minify_html = true
edit_url = "https://github.com/MohamedElashri/nida/edit/main/docs/content/"
updated_from_git = true

[markdown]
heading_anchors = true
math = true

[feed]
enabled = false

[sitemap]
enabled = true
filename = "sitemap.xml"

[robots]
enabled = true
filename = "robots.txt"

[server]
host = "127.0.0.1"
port = 1702
livereload = true

[sections]
default_sort_by = "weight"
paginate_by = 0
paginate_path = "page"

[permalinks]
guide = "/guide/{slug}/"
reference = "/reference/{slug}/"
advanced = "/advanced/{slug}/"

[search]
enabled = true
filename = "search_index.en.js"

[pipeline]
fingerprint = true
minify_css = true
minify_js = true

