# Content for the docs home page.
eyebrow = "Static site generator"
title = "Publish Markdown, *without the ceremony*."
tagline = "Nida is a small, fast Go static site generator for blogs, personal sites, and documentation. One binary, plain templates, and output you can host anywhere."
about_title = "Built with Nida"
about = """This site is built with Nida, using a theme that lives in the repository at [`docs/themes/nida-docs`](https://github.com/MohamedElashri/nida/tree/main/docs/themes/nida-docs). Its sidebar, search, breadcrumbs, page outline, "last updated" dates, translations, and shortcodes all come from features described in these docs, so it doubles as a working example."""
sample_title = "content/posts/hello.md"
sample = '''
```markdown
+++
title = "Hello, Nida"
date = 2026-10-17
tags = ["intro"]
+++

A short post with a summary.

<!-- more -->

> [!TIP]
> Run `nida serve` and edit; the browser reloads.

{{< figure src="cover.png" alt="Cover" >}}
```
'''

