# Content for the docs home page.
eyebrow = "Static site generator"
title = "Publish Markdown, *without the ceremony*."
tagline = "Nida is a small, fast Go static site generator for blogs, personal sites, and documentation. One binary, plain templates, and output you can host anywhere."
about = "This site is built with Nida. Its theme lives in [`docs/themes/nida-docs`](https://github.com/MohamedElashri/nida/tree/main/docs/themes/nida-docs), and everything on it, from search to the sidebar, uses features these docs describe."
sample_title = "content/posts/hello.md"
paths_title = "Choose your path"
# The sample is highlighted by hand with the z- classes of syntax.css:
# Chroma has no lexer for Markdown with front matter and shortcodes.
sample = """<span class="z-cm">+++</span>
<span class="z-nv">title</span> <span class="z-o">=</span> <span class="z-s">"Hello, Nida"</span>
<span class="z-nv">date</span> <span class="z-o">=</span> <span class="z-m">2026-10-17</span>
<span class="z-nv">tags</span> <span class="z-o">=</span> <span class="z-p">[</span><span class="z-s">"intro"</span><span class="z-p">]</span>
<span class="z-cm">+++</span>

A short post with a summary.

<span class="z-c">&lt;!-- more --&gt;</span>

<span class="z-k">&gt;</span> <span class="z-kc">[!TIP]</span>
<span class="z-k">&gt;</span> Run <span class="z-sb">`nida serve`</span> and edit; the browser reloads.

<span class="z-nt">{{&lt;</span> <span class="z-nf">figure</span> <span class="z-na">src</span><span class="z-o">=</span><span class="z-s">"cover.png"</span> <span class="z-na">alt</span><span class="z-o">=</span><span class="z-s">"Cover"</span> <span class="z-nt">&gt;}}</span>"""

[migrate]
title = "Coming from another generator?"
text = "`nida migrate` converts the site, keeps every URL, and writes a report of anything left to do by hand."
command = "nida migrate ./old-site ./new-site"
link = "Migration guide"
url = "/guide/migrating/"
sources = ["Hugo", "Jekyll", "Zola", "Eleventy", "Pelican"]

[[actions]]
name = "Get started"
url = "/guide/getting-started/"
primary = true

[[actions]]
name = "Browse the reference"
url = "/reference/"

[[features]]
icon = "pen"
title = "Writing that scales"
text = "Markdown with the extras technical writing needs, rendered without a CDN."
items = ["Callouts", "Math", "Mermaid", "Code titles", "Shortcodes"]

[[features]]
icon = "layers"
title = "Themes you can extend"
text = "Override any template, shortcode, asset, or string without forking the theme."
items = ["Inheritance", "Partials", "Data files", "i18n"]

[[features]]
icon = "rss"
title = "Blog essentials"
text = "Everything a blog expects, built in and configured in a few lines."
items = ["Tags", "Series", "Related posts", "Atom & RSS", "SEO"]

[[features]]
icon = "bolt"
title = "Fast and dependency-free"
text = "A single Go binary that renders in parallel and rebuilds as you type."
items = ["One binary", "Parallel builds", "Live reload", "Offline"]

[[features]]
icon = "check"
title = "Catches mistakes early"
text = "nida check runs the whole build and reports problems before you deploy."
items = ["Broken links", "Missing images", "Config typos", "External links"]

[[features]]
icon = "globe"
title = "Made for every language"
text = "Right-to-left layouts and translatable theme text, used by Arabic sites."
items = ["RTL", "Unicode slugs", "Translations"]



