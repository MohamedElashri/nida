# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/" 
    schedule:
      interval: "weekly"
    # goja is not a module dependency: it is a patched copy in
    # third_party/goja, updated by scripts/vendorgoja and watched by
    # .github/workflows/goja.yml.
  # Pele and Temml are embedded in the binary. After a bump, CI fails until
  # someone runs `make vendor-js` on the branch and pushes the result.
  - package-ecosystem: "npm"
    directory: "/third_party/js"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
