name: ci

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
    tags-ignore:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
        with:
          ref: ${{ github.actor == 'dependabot[bot]' && github.head_ref || '' }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # sanad: ref=v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail

          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            echo "The following files need gofmt:" >&2
            echo "${files}" >&2
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Vendor JavaScript for Dependabot
        if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/vendorjs
          git add internal/
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "vendor: update embedded JavaScript assets [dependabot skip]"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Check bundled JavaScript matches third_party/js
        run: go run ./scripts/vendorjs -check

      - name: Check patched goja matches upstream plus third_party/goja.patch
        run: go run ./scripts/vendorgoja -check

      - name: Run tests
        run: go test ./...

      - name: Build example site
        run: go run ./cmd/nida build --site ./example-site

      - name: Build Arabic example site
        run: go run ./cmd/nida build --site ./example-site-ar

      - name: Check documentation site
        run: |
          go run ./scripts/generate_release_notes.go
          go run ./cmd/nida check --site ./docs
