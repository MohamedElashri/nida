<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
  {{- partial "head.html" . -}}
  <body class="{{ if .IsHome }}home{{ else }}inner{{ end }}">
    {{- partial "header.html" . -}}
    <main id="content">
      {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}
  </body>
</html>
