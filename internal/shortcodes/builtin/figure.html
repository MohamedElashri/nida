{{- $src := .ResolveURL (.Get "src") -}}
<figure{{ with .Get "class" }} class="{{ . }}"{{ end }}>
{{- with .Get "link" }}<a href="{{ $.ResolveURL . }}">{{ end -}}
<img src="{{ $src }}" alt="{{ default (.Get "alt") (plainify (.Get "caption")) }}"{{ with .Get "width" }} width="{{ . }}"{{ end }}{{ with .Get "height" }} height="{{ . }}"{{ end }} loading="lazy" decoding="async">
{{- if .Get "link" }}</a>{{ end -}}
{{- with .Get "caption" }}<figcaption>{{ markdownify . }}</figcaption>{{ end -}}
</figure>
